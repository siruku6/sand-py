[project]
name = "sand-py"
version = "0.1.0"
description = "Reproducible Docker + uv environment for PyTorch experiments."
requires-python = "==3.12.*"

dependencies = [
    "jax==0.4.20",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "mlflow>=2.22.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pillow>=10.4.0",
    "pytest>=8.3.5",
    "pyyaml>=6.0",
    "grad-cam>=1.5.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.1",
    "setuptools==69.5.1",  # for tensorboad==2.20.0
    "sympy==1.14.0",
    "tensorboard>=2.20.0",
    "tensorboard-data-server>=0.7.2",
    "tensorboard-plugin-wit>=1.8.1",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "timm>=1.0.22",
    "tqdm>=4.67.1",

    "openpyxl",
    "pdfminer.six",
    "pypdf",
]


[tool.ruff.lint.isort]
known-first-party = ["src"]


# >>> PyTorch の CPU 版を使用する ---------------------
# PyTorch の CPU 版を使用する
# CUDA 版が必要な場合は URL を変更する
# 例えばこのようにする: https://download.pytorch.org/whl/cu113
[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
# --------------------- PyTorch の CPU 版を使用する - ここまで <<<

