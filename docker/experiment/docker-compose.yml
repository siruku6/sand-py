services:
  uv_env:
    build:
      context: ../../
      dockerfile: ./docker/experiment/Dockerfile
      args:
        WORKING_DIRECTORY: ${WORKING_DIRECTORY}
    environment:
      - TZ=Asia/Tokyo
      - PYTHONPATH=/${WORKING_DIRECTORY}:/${WORKING_DIRECTORY}/src
      - JUPYTER_PORT=${JUPYTER_PORT}
      - MLFLOW_PORT=${MLFLOW_PORT}
      - TENSORBOARD_PORT=${TENSORBOARD_PORT}

    # Fix slow shutdown of web container
    init: true
    volumes:
      # bind mount
      - ../../:/${WORKING_DIRECTORY}
    shm_size: '20gb'
    ports:
      - ${MLFLOW_PORT}:${MLFLOW_PORT}
      - ${JUPYTER_PORT}:${JUPYTER_PORT}
      - ${TENSORBOARD_PORT}:${TENSORBOARD_PORT}

    # INFO: Following two lines are necessary for the backtrace by pdb
    stdin_open: true
    tty: true

    command: >
      bash -c "
        uv run mlflow ui --host 0.0.0.0 --port ${MLFLOW_PORT} &
        uv run tensorboard --logdir logs/ --host=0.0.0.0 --port ${TENSORBOARD_PORT} & \
        uv run jupyter notebook --no-browser --ip=0.0.0.0 --port ${JUPYTER_PORT} --allow-root --NotebookApp.token='demo'
      "
    working_dir: "/${WORKING_DIRECTORY}"
